  # abstract base, virtual method, override, override of the override (dispatch is transitive)
  - 'OVERRIDES dn:M:MiniPlant.Core.LinearStage.Calibrate -> dn:M:MiniPlant.Core.StageBase.Calibrate'
  - 'OVERRIDES dn:M:MiniPlant.Core.PrecisionLinearStage.Calibrate -> dn:M:MiniPlant.Core.LinearStage.Calibrate'
