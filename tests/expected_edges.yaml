# Expected graph for fixtures/MiniPlant (SPEC 11.1). tests/test_fixture_edges.py fails on any missing edge
# and on any unexpected edge between indexed (non-External) nodes.
#
# must_have: hand-written, one block per fixture feature; also covers the platform-specific C++/CLI owner,
#            whose exact IL differs between the real C++/CLI DLL (Windows) and the C# stand-in (elsewhere).
# nodes / messages: properties the classification and template passes must set.
# exact: every edge between indexed nodes (C# and native owners), generated by tests/tools/snapshot_edges.py
#        and reviewed line by line. Regenerate only after reviewing the diff.
# Edge format: "<TYPE> <start id> -> <end id> [key=value ...]" (no file/line: those are checked in tests).

must_have:
