# codegraph configuration for the MiniPlant fixture. Paths are relative to this file.
repo_root: "."
solutions:
  - "MiniPlant.sln"
msbuild_properties:
  Configuration: "Debug"
  Platform: "x64"
max_compile_errors: 0

output_dir: "../../out/fixture"

roslyn:
  max_parallelism: 0
  diagnostics: "full"
  exclude_projects: []
  prefer_target_framework: ""

cppcli_assemblies:
  - path: "bin/MiniPlant.Interop.dll"
    source_dir: "interop/MiniPlant.Interop"

native_dlls:
  - "bin/MiniPlant.Native.dll"

native:
  compdb: "../../out/fixture/compile_commands.json"
  target: "x86_64-pc-windows-msvc"
  extra_args: ["-fms-compatibility", "-fms-extensions", "-fdelayed-template-parsing", "-Wno-everything"]
  exports_from: "source"
  modules: []
  max_workers: 0

log_methods:
  - { type_implements: "log4net.ILog", methods: ["Debug", "Info", "Warn", "Error", "Fatal"], template_arg: 0, level_from: "method", template_style: "literal" }
  - { type_implements: "log4net.ILog", methods: ["DebugFormat", "InfoFormat", "WarnFormat", "ErrorFormat", "FatalFormat"], template_arg: 0, level_from: "method", template_style: "composite" }
native_log_functions:
  - { name: "LogMessage", template_arg: 1, level_arg: 0 }

config_accessors:
  - { member: "System.Configuration.ConfigurationManager.AppSettings", kind: "indexer" }

test_attributes: []
test_assembly_patterns: ["*.Tests"]
entry_point_attributes:
  - { attribute: "System.ServiceModel.OperationContractAttribute", kind: "remote" }
ui_event_base_types: ["System.Windows.Forms.Control", "System.Windows.UIElement"]

layers:
  - { name: "native_interop", assemblies: ["*.Interop", "*.Native*"] }
  - { name: "core",           assemblies: ["*.Core", "*.Common"] }
  - { name: "services",       assemblies: ["*.Services*"] }
  - { name: "ui",             assemblies: ["*.UI*", "*.App"] }

git_history:
  window_days: 730
  co_change_min: 2
  co_change_max_files: 30

log_prefix_regex: '^\d{4}-\d{2}-\d{2}[ T][\d:.,]+\s+\[\w+\]\s+'

neo4j:
  uri: "bolt://localhost:7687"
  database: "neo4j"
  user_writer: "neo4j"
  password_writer_env: "CODEGRAPH_NEO4J_PASSWORD"
  user_reader: "codegraph_ro"
  password_reader_env: "CODEGRAPH_NEO4J_RO_PASSWORD"
  home: ""
  import_method: "admin"

limits:
  max_depth: 8
  max_results: 200
  query_timeout_s: 15
